# case 2: dragless brick dropped from 30,000 ft. the sim can't set the initial 10/20/30 deg/s spin, so only the translation compares
# ECI is ECEF at t = 0, so lat 0 lon 0 lies on +x and the inertial velocity is the
# earth relative velocity plus the earth's spin (w x r, w = 7.292115e-5 rad/s)

rockets:
  - name: atmos_02
    track_data: true
    export_interval: 0.1

    start_in_eci: true
    eci_position_m: [6387281.000000, 0.000000, 0.000000]
    eci_velocity_m_s: [0.000000, 465.767876, 0.000000]

    nosecone_length: 0.0
    nosecone_mass: 0.0

    # 8 x 4 x 2.25 in brick as a cylinder with the same mass and long axis inertia
    stage:
      - id: 1
        geometry:
          shape: cylinder
          radius: 0.0476
        dry_mass: 2.26796
        fuel_mass: 0.0
        length: 0.2032
        com_distance: 0.1016
        thrust_curve: ../../../zero_thrust.csv
