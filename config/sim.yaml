# sim settings, the rockets themselves are configured in rocket.yaml

time_step: 0.01   # seconds
step_delay: 0.001  # the time in between steps the sim stops to take a break (for visualization purposes)
max_time: 100000       # simulation lifetime, seconds (0 = run forever)

# other body gravity
moon_gravity: true   # include moon gravity
sun_gravity: true    # include sun gravity
ephemeris: config/de440s.bsp    # JPL DE440
epoch: "2026-10-10T12:00:00"    # UTC date and time at sim start

# integrator
integrator: rk4 # rk4 or dop853, !!!NOTE: dop853 is 3dof

# aerodynamics
drag: true

# earth model
gravity: j2           # j2 or inverse_square
earth_rotation: true
# earth_gm, earth_j2, earth_radius, and moon_gm can be added to override values in planetary_constants.hpp
