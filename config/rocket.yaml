# rocket geometry, launch scenario, and propulsion configuration

# one full entry per rocket
rockets:
  - name: rocket_1
    track_data: true # if true, writes this rocket's flight data to data/<name>.csv
    export_interval: 1.0 # sim seconds between exported rows (0 = every step)

    origin_lat: 48.209
    origin_lon: -101.406
    target_lat: 36.153
    target_lon: -5.346

    start_in_orbit: false # if true, starts on the orbit below
    semi_major_axis_km: 6778.0
    eccentricity: 0.0
    inclination_deg: 51.6
    raan_deg: 0.0
    arg_periapsis_deg: 0.0
    true_anomaly_deg: 0.0

    radius: 0.835 # radius of the rocket (cylinder)
    nosecone_length: 3.0
    nosecone_mass: 100.0 # mass of the nosecone/payload on top of the last stage (kg)
    nosecone_com_distance: 2.0 # nosecone CoM back from the nose tip (m), defaults to 2/3 of nosecone_length if omitted
    no_fc: false # if true, this rocket spawns without a flight controller (no guidance/autopilot)

    stage:
      - id: 1
        dry_mass: 2292.0 # mass of empty stage
        fuel_mass: 20938.0 # mass of fuel
        length: 7.49 # from tip to tail of the stage
        com_distance: 3.75 # from tip to tail of the stage
        fuel_com_distance: 3.6 # CoM of the propellant column with a full tank
        fuel_length: 6.0 # length of the propellant column with a full tank
        engine_distance: 7.49 # distance from the top of the stage
        gimbal_range_deg: 5.0 # degrees
        thrust_curve: stage1_thrust_curve.csv # thrust curve file path

      - id: 2
        dry_mass: 795.0
        fuel_mass: 6237.0
        length: 4.12
        com_distance: 2.06
        fuel_com_distance: 1.95
        fuel_length: 3.2
        engine_distance: 4.12
        gimbal_range_deg: 5.0
        thrust_curve: stage2_thrust_curve.csv

      - id: 3
        dry_mass: 1100.0
        fuel_mass: 3306.0
        length: 6.59
        com_distance: 3.3
        fuel_com_distance: 4.2
        fuel_length: 2.4
        engine_distance: 6.59
        gimbal_range_deg: 4.0
        rcs_max_moment: [100.0, 100.0, 100.0]
        thrust_curve: stage3_thrust_curve.csv
